<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#6366f1">
  <title>메이플 사냥 타이머</title>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-0T6NV70YFK"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-0T6NV70YFK');
  </script>
  <style>
    :root{--bg:#f5f7fb;--a1:#c7d2fe;--a2:#a7f3d0;--card:rgba(255,255,255,.78);--border:rgba(255,255,255,.5);--text:#1f2937;--muted:#6b7280;--green:#16a34a;--red:#dc2626;--blue:#6366f1;--accent:#8b5cf6;--shadow:0 10px 30px rgba(31,41,55,.15);--ring:0 0 0 3px rgba(99,102,241,.25)}
    body.theme-dark{--bg:#0b1220;--a1:#1f2a44;--a2:#153a2f;--card:rgba(17,24,39,.72);--border:rgba(148,163,184,.2);--text:#e5e7eb;--muted:#9ca3af;--green:#22c55e;--red:#f87171;--blue:#8b5cf6;--accent:#22d3ee;--shadow:0 10px 30px rgba(0,0,0,.45);--ring:0 0 0 3px rgba(34,211,238,.25)}
    *{box-sizing:border-box} body{font-family:"Segoe UI",Roboto,"Noto Sans KR",AppleSDGothicNeo,Arial,sans-serif;display:flex;justify-content:center;align-items:center;min-height:100vh;min-height:100dvh;margin:0;padding:max(12px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));color:var(--text);background:radial-gradient(1200px 800px at 10% -10%,var(--a1),transparent 70%),radial-gradient(1000px 700px at 110% 10%,var(--a2),transparent 75%),var(--bg)}
    .app{width:min(92vw,520px);padding:28px;border:1px solid var(--border);border-radius:16px;background:var(--card);box-shadow:var(--shadow);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
    h1{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:22px}.logo{display:grid;place-items:center;width:28px;height:28px;border-radius:8px;color:#fff;background:linear-gradient(135deg,var(--blue),var(--accent))}.sub,.note{color:var(--muted);font-size:13px}.status{display:inline-flex;margin:8px 0 12px;padding:6px 10px;border-radius:999px;font-weight:700;background:rgba(0,0,0,.05)}.running{color:var(--green)}.stopped{color:var(--red)}
    .card{margin-top:14px;padding:16px;border:1px solid var(--border);border-radius:14px;background:rgba(255,255,255,.28)}body.theme-dark .card{background:rgba(17,24,39,.3)}.header,.setting{display:flex;align-items:center;justify-content:space-between;gap:10px}.header{font-weight:800}.time{margin:16px 0;font:700 36px/1 monospace}.time.warning{color:var(--red)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.field{display:flex;flex-direction:column;gap:5px}.field label,.muted{color:var(--muted);font-size:12px}input[type=number]{width:100%;min-height:44px;padding:10px 12px;border:1px solid rgba(0,0,0,.12);border-radius:10px;background:rgba(255,255,255,.75);color:var(--text);font-size:16px}body.theme-dark input[type=number]{border-color:rgba(255,255,255,.1);background:rgba(17,24,39,.5)}input:focus-visible,button:focus-visible{outline:0;box-shadow:var(--ring)}
    .buttons{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}button{min-height:44px;padding:10px 14px;border:0;border-radius:10px;cursor:pointer;touch-action:manipulation;font-size:14px;font-weight:700}.primary{color:#fff;background:linear-gradient(135deg,var(--green),#22c55e)}.danger{color:#fff;background:linear-gradient(135deg,var(--red),#ef4444)}.secondary{color:var(--text);background:rgba(127,127,127,.15)}button:disabled{cursor:not-allowed;opacity:.48}
    .settings{display:grid;gap:12px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}.setting label{flex:1}.setting input[type=checkbox]{width:22px;height:22px}.notice{min-height:20px;margin:12px 0 0;color:var(--muted);font-size:12px}.note{margin-top:16px;padding-top:12px;border-top:1px solid var(--border)}
    @media(max-width:480px){body{align-items:flex-start}.app{width:100%;padding:18px 14px}.grid{grid-template-columns:1fr}.buttons button{flex:1 1 calc(50% - 5px)}.time{font-size:32px}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <main class="app">
    <h1><span class="logo">⏱</span>메이플 사냥 타이머</h1>
    <p class="sub">숨돌방지 주기를 실제 경과 시간 기준으로 알려줍니다.</p>
    <div id="global-status" class="status stopped" role="status">정지</div>

    <section class="card" aria-labelledby="timer-title">
      <div class="header"><span id="timer-title">숨돌방지</span><span id="timer-status" class="muted">대기</span></div>
      <div id="remaining" class="time" aria-live="off">10.00s</div>
      <div class="grid">
        <div class="field"><label for="interval">간격(초)</label><input id="interval" type="number" inputmode="decimal" min="0.1" step="0.1" value="10.0"></div>
        <div class="field"><label for="frequency">주파수(Hz)</label><input id="frequency" type="number" inputmode="numeric" min="1" max="20000" step="1" value="880"></div>
        <div class="field"><label for="duration">울림(초)</label><input id="duration" type="number" inputmode="decimal" min="0.05" max="10" step="0.05" value="0.3"></div>
      </div>
      <div class="buttons">
        <button id="start" class="primary">시작</button><button id="stop" class="danger" disabled>중지</button><button id="pause" class="secondary" disabled>일시정지</button><button id="reset" class="secondary">초기화</button>
      </div>
    </section>

    <section class="settings" aria-label="설정">
      <div class="setting"><label for="warning">3초 이하 화면 경고</label><input id="warning" type="checkbox" checked></div>
      <div class="setting"><label for="notifications">백그라운드 시스템 알림</label><button id="notifications" class="secondary">알림 허용</button></div>
      <div class="setting"><label for="theme">다크 모드</label><input id="theme" type="checkbox"></div>
    </section>
    <p id="notice" class="notice" role="status"></p>
    <p class="note">모바일 운영체제가 브라우저를 완전히 중지하면 소리는 지연될 수 있습니다. 복귀 시 타이머는 실제 경과 시간으로 즉시 보정됩니다.</p>
  </main>

  <script>
    class MapleTimer {
      constructor() {
        this.defaults={interval:10000,freq:880,dur:.3};
        this.timer={...this.defaults,remaining:this.defaults.interval,isPaused:false};
        this.isRunning=false;this.lastTick=0;this.lastRender=0;this.rafId=null;this.backgroundId=null;this.audioContext=null;this.wakeLock=null;this.registration=null;
        this.dom={globalStatus:document.querySelector('#global-status'),timerStatus:document.querySelector('#timer-status'),remaining:document.querySelector('#remaining'),interval:document.querySelector('#interval'),freq:document.querySelector('#frequency'),dur:document.querySelector('#duration'),start:document.querySelector('#start'),stop:document.querySelector('#stop'),pause:document.querySelector('#pause'),reset:document.querySelector('#reset'),warning:document.querySelector('#warning'),notifications:document.querySelector('#notifications'),theme:document.querySelector('#theme'),notice:document.querySelector('#notice')};
        this.loadSettings();this.bind();this.initServiceWorker();this.render(true);
      }
      bind(){
        this.dom.start.addEventListener('click',()=>this.start());this.dom.stop.addEventListener('click',()=>this.stop());this.dom.pause.addEventListener('click',()=>this.togglePause());this.dom.reset.addEventListener('click',()=>this.reset());
        [this.dom.interval,this.dom.freq,this.dom.dur].forEach(el=>el.addEventListener('change',()=>{this.syncInputs();this.saveSettings();this.render(true)}));
        this.dom.warning.addEventListener('change',()=>{this.saveSettings();this.render(true)});this.dom.theme.addEventListener('change',()=>{this.applyTheme();this.saveSettings()});this.dom.notifications.addEventListener('click',()=>this.enableNotifications());
        document.addEventListener('visibilitychange',()=>this.onVisibilityChange());window.addEventListener('pagehide',()=>this.releaseWakeLock());
      }
      async prepareAudio(){
        const AudioContextClass=window.AudioContext||window.webkitAudioContext;if(!AudioContextClass)throw new Error('이 브라우저는 오디오를 지원하지 않습니다.');
        if(!this.audioContext)this.audioContext=new AudioContextClass();if(this.audioContext.state==='suspended')await this.audioContext.resume();
        const buffer=this.audioContext.createBuffer(1,1,22050),source=this.audioContext.createBufferSource();source.buffer=buffer;source.connect(this.audioContext.destination);source.start();
      }
      playBeep(){
        if(!this.audioContext||this.audioContext.state!=='running')return;const now=this.audioContext.currentTime,osc=this.audioContext.createOscillator(),gain=this.audioContext.createGain();
        osc.frequency.setValueAtTime(this.timer.freq,now);gain.gain.setValueAtTime(.3,now);gain.gain.exponentialRampToValueAtTime(.0001,now+this.timer.dur);osc.connect(gain);gain.connect(this.audioContext.destination);osc.start(now);osc.stop(now+this.timer.dur);
      }
      syncInputs(){
        const interval=Math.max(.1,Number(this.dom.interval.value)||.1)*1000;this.timer.interval=Math.round(interval);this.timer.remaining=Math.min(this.timer.remaining,this.timer.interval);
        this.timer.freq=Math.min(20000,Math.max(1,Math.round(Number(this.dom.freq.value)||1)));this.timer.dur=Math.min(10,Math.max(.05,Number(this.dom.dur.value)||.05));
        this.dom.interval.value=(this.timer.interval/1000).toFixed(1);this.dom.freq.value=String(this.timer.freq);this.dom.dur.value=String(this.timer.dur);
      }
      tick(now){
        if(!this.isRunning)return;const elapsed=Math.max(0,now-this.lastTick);this.lastTick=now;
        if(!this.timer.isPaused){this.timer.remaining-=elapsed;if(this.timer.remaining<=0){const cycles=Math.floor(-this.timer.remaining/this.timer.interval)+1;this.timer.remaining+=cycles*this.timer.interval;this.alert();}}
        if(now-this.lastRender>=100){this.lastRender=now;this.render();}
      }
      alert(){this.playBeep();if(document.hidden&&'Notification'in window&&Notification.permission==='granted')this.showNotification();}
      foregroundLoop=(now)=>{this.tick(now);if(this.isRunning&&!document.hidden)this.rafId=requestAnimationFrame(this.foregroundLoop)};
      startForeground(){this.stopLoops();this.lastTick=performance.now();this.rafId=requestAnimationFrame(this.foregroundLoop)}
      startBackground(){this.stopLoops();this.lastTick=performance.now();this.backgroundId=setInterval(()=>this.tick(performance.now()),1000)}
      stopLoops(){if(this.rafId!==null){cancelAnimationFrame(this.rafId);this.rafId=null}if(this.backgroundId!==null){clearInterval(this.backgroundId);this.backgroundId=null}}
      async start(){
        if(this.isRunning)return;this.syncInputs();try{await this.prepareAudio()}catch(error){this.dom.notice.textContent=error.message}
        this.isRunning=true;this.timer.isPaused=false;this.timer.remaining=this.timer.interval;await this.requestWakeLock();document.hidden?this.startBackground():this.startForeground();this.render(true);
      }
      stop(){if(!this.isRunning)return;this.isRunning=false;this.timer.isPaused=false;this.timer.remaining=this.timer.interval;this.stopLoops();this.releaseWakeLock();this.render(true)}
      togglePause(){if(!this.isRunning)return;this.timer.isPaused=!this.timer.isPaused;this.lastTick=performance.now();this.render(true)}
      reset(){this.timer={...this.defaults,remaining:this.defaults.interval,isPaused:false};this.dom.interval.value='10.0';this.dom.freq.value='880';this.dom.dur.value='0.3';this.saveSettings();this.render(true)}
      async onVisibilityChange(){if(!this.isRunning)return;this.tick(performance.now());if(document.hidden)this.startBackground();else{this.startForeground();await this.requestWakeLock();this.render(true)}}
      async requestWakeLock(){
        if(!this.isRunning||document.hidden||!('wakeLock'in navigator)||this.wakeLock)return;
        try{const sentinel=await navigator.wakeLock.request('screen');this.wakeLock=sentinel;sentinel.addEventListener('release',()=>{if(this.wakeLock===sentinel)this.wakeLock=null})}catch(error){console.warn('Wake Lock 요청 실패:',error)}
      }
      async releaseWakeLock(){const sentinel=this.wakeLock;this.wakeLock=null;try{await sentinel?.release()}catch(error){console.warn('Wake Lock 해제 실패:',error)}}
      async initServiceWorker(){if('serviceWorker'in navigator)try{this.registration=await navigator.serviceWorker.register('./sw.js')}catch(error){console.warn('Service Worker 등록 실패:',error)}this.updateNotificationButton()}
      async enableNotifications(){
        if(!('Notification'in window)){this.dom.notice.textContent='이 브라우저는 시스템 알림을 지원하지 않습니다.';return}
        const permission=await Notification.requestPermission();this.updateNotificationButton();this.dom.notice.textContent=permission==='granted'?'시스템 알림이 켜졌습니다.':'알림 권한이 허용되지 않았습니다.';
      }
      updateNotificationButton(){if(!('Notification'in window)){this.dom.notifications.disabled=true;this.dom.notifications.textContent='지원 안 함'}else if(Notification.permission==='granted'){this.dom.notifications.disabled=true;this.dom.notifications.textContent='알림 켜짐'}}
      async showNotification(){try{const registration=this.registration||await navigator.serviceWorker.ready;await registration.showNotification('숨돌방지 갱신',{body:'다음 주기가 시작되었습니다.',tag:'maple-timer',renotify:true,silent:true})}catch(error){console.warn('알림 표시 실패:',error)}}
      render(force=false){
        if(!force&&!this.isRunning)return;const seconds=Math.max(0,this.timer.remaining)/1000;this.dom.remaining.textContent=seconds.toFixed(2)+'s';this.dom.remaining.classList.toggle('warning',this.dom.warning.checked&&seconds<=3);
        this.dom.globalStatus.textContent=this.isRunning?'실행 중':'정지';this.dom.globalStatus.className=`status ${this.isRunning?'running':'stopped'}`;this.dom.timerStatus.textContent=!this.isRunning?'대기':this.timer.isPaused?'일시정지':'동작 중';
        this.dom.start.disabled=this.isRunning;this.dom.stop.disabled=!this.isRunning;this.dom.pause.disabled=!this.isRunning;this.dom.pause.textContent=this.timer.isPaused?'재개':'일시정지';
      }
      applyTheme(){document.body.classList.toggle('theme-dark',this.dom.theme.checked)}
      saveSettings(){localStorage.setItem('mapleTimerSettings',JSON.stringify({theme:this.dom.theme.checked,warning:this.dom.warning.checked,interval:this.timer.interval,freq:this.timer.freq,dur:this.timer.dur}))}
      loadSettings(){
        try{const s=JSON.parse(localStorage.getItem('mapleTimerSettings')||'{}');this.dom.theme.checked=Boolean(s.theme);this.dom.warning.checked=s.warning!==false;if(Number.isFinite(s.interval)&&s.interval>=100)this.timer.interval=this.timer.remaining=s.interval;if(Number.isFinite(s.freq))this.timer.freq=s.freq;if(Number.isFinite(s.dur))this.timer.dur=s.dur;this.dom.interval.value=(this.timer.interval/1000).toFixed(1);this.dom.freq.value=String(this.timer.freq);this.dom.dur.value=String(this.timer.dur)}catch(error){console.warn('설정 복원 실패:',error)}this.applyTheme();
      }
    }
    new MapleTimer();
  </script>
</body>
</html>
